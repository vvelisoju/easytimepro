{% load i18n static common %}
<style>
    .layui-layer-page .layui-layer-content {
        position: initial;
        height: 455px !important;
        overflow: hidden;
        width: 705px !important;
    }
</style>
<div style="margin: 20px 0 0 20px;height: 485px;width: 740px;">
    <form class="layui-form action-form" action method="post" id="{{ model_name }}_{{ action_repr }}">
        {% csrf_token %}
        <div class="layui-upload">
          <button type="button" class="layui-btn js-addfileupload" id="idUpload">
            <i class="fa fa-fw fa-plus"></i>{% trans 'bioPhotoImport_button_upload' %}
          </button>
          <button type="button" class="layui-btn" id="idClear">
            <i class="fa fa-fw fa-trash-o"></i>{% trans 'bioPhotoImport_button_clear' %}
          </button>
          <blockquote class="layui-elem-quote layui-quote-nm" style="height:305px;width:664px;margin-top: 10px;border-width: 1px;overflow-y: scroll">
            <div class="layui-upload-list" id="idReview"></div>
         </blockquote>
        </div>
        <div class="js-fileuploads" style="display:none;"></div>
        <div class="layui-card" style="width: 664px;"><div class="layui-card-body">
          <div><span style="color: red">*</span><span>{% trans 'form_helpText_title' %}</span></div>
          <div style="padding: 0 0 10px 30px;">
            <p>{% trans 'Please_make_sure_to_upload_dat_file' %}</p>
          </div>
        </div></div>
    </form>
</div>

    document.addEventListener('click',function(event){
        if(event.target.nodeName == "I"){
            event.preventDefault();
            var element_id = event.target.closest('div').parentElement.id;
            var remove_id = event.target.closest('div').innerText;
            var upload_file = document.querySelectorAll("input[name='upload_file']")
            upload_file.forEach((photo) => {
                const data = new DataTransfer()
                console.log(data)
                for(var i = 0; i < photo.files.length; i++){
                    if (photo.files[i]['name'] !== remove_id){
                        data.items.add(photo.files[i])
                    }
                }
              photo.files = data.files;
            });
            $(`#${element_id}`).remove();
        }
    });
    $("#idClear").click(function () {
      $("#idReview").empty();
      $("input[name='upload_file']").val("");
    });
</script>

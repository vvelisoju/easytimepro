<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
    <title>Paytm Secure Online Payment Gateway</title>
    <style>
        .vh-center {
            width: 50%;
            background: white;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-right: -50%;
            transform: translate(-50%, -50%);
        }

        .payment-transaction {
            background: #EFEFEF;
            min-width: 600px;
            min-height: 280px;
            padding: 50px;
            font: 14px;
        }

        .payment-loader {
            border: 6px solid #CCC; /* Light grey */
            border-top: 6px solid #7AC143; /* Blue */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin1 1s linear infinite;
        }

        .text-center {
            text-align: center;
        }

        @keyframes spin1 {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .align-center {
            margin: 0 auto;
        }

        .payment-process-heading {
            color: #00559b;
            font-size: 28px;
            text-align: center;
        }
    </style>
</head>
<body>
<section class="vh-center">
    <div class="payment-transaction">
        <table align="center" cellpadding="5">
            <tr>
                <td><STRONG class="payment-process-heading">Transaction is being processed</STRONG></td>
            </tr>
            <tr>
                <td class="text-center"><font color='blue'>Please wait...</font></td>
            </tr>
        </table>
        <br>
        <div class="align-center payment-loader"></div>
        <br>
        <!--Banner-->
        <section id="contact" class="section-padding">
            <div class="container">
                <div class="header" style="text-align: center;">
                    <div class="grid_12" style="text-align: center;padding:20px 0px;">
                        <span class="font-42">Page will jump to Paytm payment page...</span>
                        <br><br>
                        <p class="font-18">Please Do Not Refresh The Page.</p>
                    </div>
                </div>
                <form method="post" action="{{ transaction_url }}" name="f1">
                    {% for key,value in paytm_dict.items %}
                        <input type="hidden" name="{{ key }}" value="{{ value }}">
                    {% endfor %}
                </form>
            </div>
        </section>
    </div>
</section>
<!--/ Banner-->
</body>
<script type="text/javascript">document.f1.submit();</script>
</html>

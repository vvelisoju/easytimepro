{% load i18n static %}
<div id="{{ model_name }}_edit_form" style="padding: 10px; width:540px; height:450px;">
    <form class="layui-form data-form" action="" method="post" >
        {% csrf_token %}
        <div>
            {% for fieldset in adminform %}
              {% include "includes/fieldset.html" %}
            {% endfor %}

        </div>
    </form>
</div>
<script>
    layui.use('form', function() {
        var form = layui.form;
        form.render();
    });
</script>

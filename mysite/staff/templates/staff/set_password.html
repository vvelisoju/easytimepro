{% load i18n %}
<div style="margin: 15px;">
  <form id="id_setPasswordForm" class="layui-form action-form" action="" method="post">
    {% csrf_token %}
    <div class="layui-form-item">
      <label for="id_old_password" class="layui-form-label" style="width: 150px;">
        {% trans 'staffSetPwdForm_itemLabel_oldPwd' %}<span class="required">*</span>
      </label>
      <div class="layui-input-inline">
        <input type="password" name="old_password" id="id_old_password" class="layui-input" autocomplete="off" lay-verify="required">
      </div>
    </div>
    <div class="layui-form-item">
      <label for="id_new_password" class="layui-form-label" style="width: 150px;">
        {% trans 'staffSetPwdForm_itemLabel_newPwd' %}<span class="required">*</span>
      </label>
      <div class="layui-input-inline">
        <input type="password" name="new_password" id="id_new_password" class="layui-input" autocomplete="off" lay-verify="required">
      </div>
    </div>
    <div class="layui-form-item">
      <label for="id_confirm_password" class="layui-form-label" style="width: 150px;">
        {% trans 'staffSetPwdForm_itemLabel_confirmPwd' %}<span class="required">*</span>
      </label>
      <div class="layui-input-inline">
        <input type="password" name="confirm_password" id="id_confirm_password" class="layui-input" autocomplete="off" lay-verify="required">
      </div>
    </div>
  </form>
  <script>
    $(function () {
      $("#id_old_password").focus();
    })
  </script>
</div>
